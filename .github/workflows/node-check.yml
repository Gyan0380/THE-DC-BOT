name: Bot syntax check

on:
  push:
    paths:
      - "bot/**"
      - ".github/workflows/node-check.yml"
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/node-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
